<title>Основы МКТ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;1,500&family=PT+Sans:wght@400;700&family=PT+Serif:ital@0;1&family=PT+Mono&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: школьная тетрадь — красная линия полей, вкладки, слева текст учебника, справа рисунок/модель на клетчатой бумаге */
:root{
  --paper:#f6f7fb; --surface:#ffffff; --ink:#1c2746; --muted:#5b6582; --line:#d8ddea;
  --grid:rgba(60,95,170,.09); --accent:#2d4db3; --accent-soft:#e4e9f9; --margin:#d1475a;
  --ok:#1d8656; --ok-soft:#e1f3ea; --bad:#c13838; --bad-soft:#fbe6e6;
  --c1:#2d4db3; --c2:#c2410c; --c3:#7c3aed; --c4:#15803d;
  --f-display:"Alegreya",Georgia,"Times New Roman",serif;
  --f-body:"PT Sans","Segoe UI",Arial,sans-serif;
  --f-math:"PT Serif",Georgia,serif;
  --f-mono:"PT Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11162a; --surface:#171e36; --ink:#e5e9f4; --muted:#9aa3bf; --line:#2a3352;
  --grid:rgba(140,170,255,.07); --accent:#93a9ff; --accent-soft:#222c4c; --margin:#ff7c8b;
  --ok:#4fc68f; --ok-soft:#173528; --bad:#ff7b7b; --bad-soft:#3a1e24;
  --c1:#6c84e0; --c2:#d9733c; --c3:#9470dc; --c4:#2fa463; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11162a; --surface:#171e36; --ink:#e5e9f4; --muted:#9aa3bf; --line:#2a3352;
  --grid:rgba(140,170,255,.07); --accent:#93a9ff; --accent-soft:#222c4c; --margin:#ff7c8b;
  --ok:#4fc68f; --ok-soft:#173528; --bad:#ff7b7b; --bad-soft:#3a1e24;
  --c1:#6c84e0; --c2:#d9733c; --c3:#9470dc; --c4:#2fa463; color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html{font-size:137.5%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.55;transition:background .2s,color .2s}
.wrap{max-width:min(78rem,100%);margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:relative;padding-block:28px 20px;padding-left:22px;display:flex;flex-wrap:wrap;gap:16px 24px;justify-content:space-between;align-items:flex-start}
header.top::before{content:"";position:absolute;left:0;top:24px;bottom:16px;width:2px;background:var(--margin)}
.htext{flex:1 1 520px;min-width:0}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px;gap:2px}
.sw button{font:inherit;font-size:.85rem;font-weight:700;letter-spacing:.04em;border:0;background:none;color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.sw button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.sw svg{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(2rem,4.6vw,3rem);line-height:1.08;margin:.25em 0 .2em;text-wrap:balance}
h1 em{font-style:italic;font-weight:500;color:var(--accent)}
.lead{max-width:64ch;color:var(--muted);margin:0}
h2{font-family:var(--f-display);font-size:1.5rem;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-size:1.2rem;margin:0}
p{margin:0}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:22px}
nav.tabs button{font:inherit;font-weight:700;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:12px 14px 10px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.m{font-family:var(--f-math);white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.82em;line-height:1.12;margin:0 .08em}
.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 .18em}
.fr>span:last-child{padding:0 .18em}
.paper-grid{background-color:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;border:1px solid var(--line);border-radius:10px}
svg.plot{display:block;width:100%;height:auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.duo.wideR{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr)}
@media (max-width:980px){.duo,.duo.wideR{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:18px}
.defn{border:1.5px solid var(--ink);border-radius:14px;padding:10px 14px;line-height:1.6}
.fblock{display:block;text-align:center;font-family:var(--f-math);font-size:1.18em;margin-top:6px}
.note{background:var(--accent-soft);border-radius:8px;padding:10px 14px;line-height:1.6}
.ex{border-left:3px solid var(--margin);padding-left:12px;line-height:1.7}
.ex .lbl{display:block;margin-bottom:2px}
ul.clean{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;line-height:1.55}
.lbl{font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-family:var(--f-math);font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
thead th{color:var(--muted);font-weight:400}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.chip{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 13px;cursor:pointer;line-height:1.4}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip{font-family:var(--f-math);font-size:.95rem}
.row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.btn{font:inherit;font-weight:700;background:var(--accent);color:var(--paper);border:0;border-radius:8px;padding:8px 16px;cursor:pointer}
.btn.ghost{background:none;color:var(--accent);border:1.5px solid var(--accent)}
.btn.sm{padding:5px 12px;font-size:.9rem}
select,input.num{font:inherit;font-family:var(--f-math);padding:4px 8px;border:1.5px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);max-width:100%}
input.num{width:6em}
input[type=range]{width:100%;accent-color:var(--accent)}
.sl{display:grid;grid-template-columns:minmax(4em,auto) 1fr 5.5em;gap:10px;align-items:center}
.sl .vl{font-family:var(--f-math);text-align:right}
.big{font-family:var(--f-math);font-size:1.35rem;line-height:1.7}
.eq{font-family:var(--f-math);font-size:1.6rem;line-height:1.6}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:st}
.steps li{display:grid;grid-template-columns:2em 1fr;gap:10px;align-items:start;counter-increment:st}
.steps li::before{content:counter(st);font-family:var(--f-mono);font-size:.85rem;color:var(--paper);background:var(--accent);border-radius:50%;width:1.7em;height:1.7em;display:grid;place-items:center;margin-top:.2em}
.steps .why{color:var(--muted);font-size:.92rem;display:block}
.steps .mx{font-family:var(--f-math);font-size:1.2rem;line-height:1.9;overflow-x:auto;display:block}
.sMode{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.9rem;margin:6px 0 12px;cursor:pointer}
.sMode input{width:1.2em;height:1.2em;accent-color:var(--accent)}
.work{border:2px dashed var(--line);border-radius:12px;min-height:220px;padding:12px 16px;color:var(--muted);font-size:.95rem;margin-bottom:14px}
#sCheck .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 6px}
#sCheck .fb{font-weight:700;margin:6px 0 12px}
#sCheck .fb.ok{color:var(--ok)}#sCheck .fb.bad{color:var(--bad)}
#sCtl .btn[disabled]{opacity:.4;cursor:default}
@media (max-width:700px){#sCheck .opts{grid-template-columns:1fr}}
.answer{border:2px solid var(--ok);background:var(--ok-soft);border-radius:10px;padding:10px 14px;font-family:var(--f-math);font-size:1.3rem;line-height:1.8}
.answer.none{border-color:var(--bad);background:var(--bad-soft)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.9rem;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px}
.qwrap{max-width:880px}
.stat{font-family:var(--f-mono);font-size:.9rem;color:var(--muted)}
.stat b{color:var(--ink);font-weight:400}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:16px}
.qcat{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.qtext{font-size:1.2rem;line-height:1.6}
.qtext .m{font-size:1.12em}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px}
.opt{font:inherit;font-family:var(--f-math);font-size:1.08rem;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:center;min-height:2.6em;line-height:1.6}
.opt .k{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;flex:none}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.expl{border-radius:8px;padding:12px 14px;font-size:1rem;line-height:1.8}
.expl.ok{background:var(--ok-soft)} .expl.no{background:var(--bad-soft)}
.expl b{display:block;margin-bottom:2px}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress > i{display:block;height:100%;background:var(--accent);transition:width .3s}
.score{font-family:var(--f-display);font-size:3rem;line-height:1}
.review{display:flex;flex-direction:column;gap:12px}
.review > div{border-left:3px solid var(--bad);padding:4px 0 4px 12px;line-height:1.7;display:flex;flex-direction:column;gap:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>
.work{min-height:max(560px,62vh)!important;font-size:.85rem!important;border:2px dashed var(--line)}

.sim{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:980px){.sim{grid-template-columns:1fr}}
canvas.vessel{display:block;width:100%;height:auto;border-radius:10px}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5em,1fr));gap:8px}
.readout>div{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--paper)}
.readout .k{display:block;font-size:.8rem;color:var(--muted);font-weight:700}
.readout .v{font-family:var(--f-math);font-size:1.25rem}
.status{border-radius:10px;padding:10px 14px;font-weight:700;line-height:1.5}
.status.sat{background:var(--accent-soft);color:var(--accent)}
.status.uns{background:var(--ok-soft);color:var(--ok)}
.status.cond{background:var(--bad-soft);color:var(--bad)}
.flux{display:grid;grid-template-columns:auto 1fr 4.5em;gap:6px 10px;align-items:center;font-size:.9rem}
.flux .bar{height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.flux .bar i{display:block;height:100%;border-radius:7px;transition:width .15s}
.obs{counter-reset:o;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.obs li{counter-increment:o;display:grid;grid-template-columns:1.8em 1fr;gap:8px;line-height:1.5}
.obs li::before{content:counter(o);font-family:var(--f-mono);font-size:.8rem;background:var(--accent-soft);color:var(--accent);border-radius:50%;width:1.6em;height:1.6em;display:grid;place-items:center;margin-top:.1em}
.cmp td,.cmp th{white-space:normal;text-align:left;font-family:var(--f-body);vertical-align:top;line-height:1.45}
.cmp th:first-child{color:var(--muted)}
.pin{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:6px}
.pin input{width:8em;font-size:1.2rem}
.fb.ok{color:var(--ok);font-weight:700}.fb.bad{color:var(--bad);font-weight:700}
.prob{font-size:1.15rem;line-height:1.7}
.tcard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:980px){.tcard{grid-template-columns:1fr}}
.cap{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:4px}

.tcard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:980px){.tcard{grid-template-columns:1fr}}
canvas.cv{display:block;width:100%;height:auto;border-radius:10px}
.stage{border-radius:10px;padding:10px 14px;font-weight:700;line-height:1.5;background:var(--accent-soft);color:var(--accent)}
.stage.boil{background:var(--bad-soft);color:var(--bad)}
</style>
<style>
#penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:900;pointer-events:none;touch-action:auto}
#penCv.on{pointer-events:auto;touch-action:none;cursor:crosshair}
#penCv.on.er{cursor:cell}
#penBar{position:fixed;right:18px;bottom:18px;z-index:901;display:flex;align-items:center;gap:6px;padding:8px;border-radius:40px;background:var(--surface);border:1px solid var(--line);box-shadow:0 6px 24px rgba(10,20,50,.18);font-family:'PT Sans',Arial,sans-serif}
#penBar button{all:unset;box-sizing:border-box;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink);transition:background .15s}
#penBar button:hover{background:var(--accent-soft)}
#penBar button[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 3px var(--accent)}
#penBar button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#penBar svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#penBar .sw{width:30px;height:30px;border-radius:50%;border:2px solid rgba(0,0,0,.15)}
#penBar .wd{background:var(--ink);border-radius:50%}
#penBar .sep{width:1px;height:36px;background:var(--line);margin:0 4px}
#penBar .tools{display:none;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#penBar.open .tools{display:flex}
#penMain{background:var(--accent)!important;color:#fff!important;width:62px!important;height:62px!important}
#penBar.open #penMain{background:var(--c2,#c2410c)!important}
@media (max-width:900px){#penBar{max-width:calc(100vw - 36px);border-radius:24px}#penBar button{width:46px;height:46px}}
</style>

<style>
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,13em),1fr));gap:10px}
.fgrid>div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper);display:flex;flex-direction:column;align-items:center;gap:2px}
.fcap{font-size:.82rem;color:var(--muted);text-align:center}
.duo2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sticky{position:sticky;top:64px}
@media (max-width:980px){.sticky{position:static}}
.cap,.lbl{text-transform:none!important;letter-spacing:.02em!important}
.cmp td{white-space:normal}
canvas.cv{display:block;width:100%;height:auto;border-radius:10px;background:var(--paper)}
.tip{background:var(--accent-soft);border-radius:10px;padding:10px 14px;line-height:1.55}
.chip{font-family:var(--f-math)}
.tcard>*{min-width:0}
.ex .m,.fblock{white-space:normal}
.fgrid .fblock{font-size:1.05em}
</style>

<div class="wrap">
  <header class="top">
    <div class="htext">
      <div class="eyebrow" data-i="eyebrow"></div>
      <h1 data-i="h1"></h1>
      <p class="lead" data-i="lead"></p>
    </div>
    <div class="ctrls">
      <div class="sw" id="langSw" role="group" aria-label="Тіл / Язык"><button data-lang="ru">РУС</button><button data-lang="kz">ҚАЗ</button></div>
      <div class="sw" id="sizeSw" role="group" aria-label="Размер шрифта"><button data-sz="16">A</button><button data-sz="22">A+</button><button data-sz="28">A++</button></div>
      <div class="sw" id="themeSw" role="group" aria-label="Тема">
        <button data-th="light"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span data-i="light"></span></button>
        <button data-th="dark"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><span data-i="dark"></span></button>
      </div>
    </div>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" id="t-theory" data-tab="theory" data-i="tTheory"></button>
    <button role="tab" id="t-gas" data-tab="gas" data-i="tGas"></button>
    <button role="tab" id="t-cryst" data-tab="cryst" data-i="tCryst"></button>
    <button role="tab" id="t-prob" data-tab="prob" data-i="tProb"></button>
    <button role="tab" id="t-train" data-tab="train" data-i="tTrain"></button>
    <button role="tab" id="t-test" data-tab="test" data-i="tTest"></button>
  </nav>
  <main>
  <div id="p-theory" class="pane"><div class="stack" id="theoryBox"></div></div>

  <div id="p-gas" class="pane" hidden>
    <div class="duo wideR">
      <div class="stack">
        <div class="card">
          <span class="lbl" data-i="modeL"></span><div class="seg" id="gMode"></div>
          <span class="lbl" data-i="gasL"></span><div class="seg" id="gGas"></div>
          <div class="sl"><span data-i="TL"></span><input type="range" id="gT" min="100" max="1000" step="10"><span class="vl" id="gTv"></span></div>
          <div class="sl" id="gVrow"><span data-i="VL"></span><input type="range" id="gV" min="1" max="5" step="0.1"><span class="vl" id="gVv"></span></div>
          <div class="sl" id="gNrow"><span data-i="NL"></span><input type="range" id="gN" min="10" max="200" step="5"><span class="vl" id="gNv"></span></div>
          <div class="row" id="gBtns"></div>
          <div class="tip" id="gTip"></div>
        </div>
        <div class="card"><span class="lbl" data-i="paramsL"></span><div class="readout" id="gRead"></div></div>
      </div>
      <div class="stack">
        <div class="card"><canvas id="gCv" class="cv" width="760" height="470"></canvas></div>
        <div class="card" id="gHistCard"><span class="lbl" data-i="histL"></span><div class="paper-grid"><svg id="gHist" class="plot" role="img" aria-label="hist"></svg></div></div>
      </div>
    </div>
  </div>

  <div id="p-cryst" class="pane" hidden>
    <div class="duo wideR">
      <div class="stack">
        <div class="card">
          <span class="lbl" data-i="crMatL"></span><div class="seg" id="crMat"></div>
          <div class="row" id="crBtns"></div>
          <div class="tip" id="crTip"></div>
        </div>
        <div class="card"><span class="lbl" data-i="crGraphL"></span><div class="paper-grid"><svg id="crG" class="plot" role="img" aria-label="graph"></svg></div></div>
      </div>
      <div class="stack"><div class="card"><canvas id="crCv" class="cv" width="760" height="470"></canvas></div></div>
    </div>
  </div>
  <div id="p-prob" class="pane" hidden>

/* ================= МОДЕЛЬ: ГАЗ / БРОУН / ДИФФУЗИЯ ================= */
const G={mode:'gas',gas:2,T:300,V:3,N:80,run:true,parts:[],big:null,trace:[],wall:true,imp:0,impT:0,pHist:[],sp:1,tick:0};
const SC=0.2; // px/s на 1 м/с
const CW_=760,CH_=470,BX=20,BY=20,BH=430;
const boxW=()=>G.mode==='gas'?60+G.V*130:720;
function gInfo(){return GASES()[G.gas];}
function newPart(x,y,M,T,col,r){const s=Math.sqrt(kB*T/(M*1e-3/NA));return{x,y,vx:gauss()*s,vy:gauss()*s,vz:gauss()*s,r,col,m:1};}
function gInit(){const g=gInfo();G.parts=[];G.trace=[];G.big=null;G.imp=0;G.impT=0;G.pHist=[];
  const W=boxW();
  if(G.mode==='gas'){for(let i=0;i<G.N;i++)G.parts.push(newPart(BX+10+Math.random()*(W-20),BY+10+Math.random()*(BH-20),g.M,G.T,g.c,g.r*.7));}
  else if(G.mode==='brown'){for(let i=0;i<260;i++)G.parts.push(newPart(BX+5+Math.random()*(W-10),BY+5+Math.random()*(BH-10),g.M,G.T,'#94a3b8',2.5));G.big={x:BX+W/2,y:BY+BH/2,vx:0,vy:0,r:18,m:12};G.trace=[[G.big.x,G.big.y]];
    G.parts=G.parts.filter(p=>Math.hypot(p.x-G.big.x,p.y-G.big.y)>24);}
  else{G.wall=true;for(let i=0;i<150;i++){const left=i%2===0;G.parts.push(newPart(left?BX+6+Math.random()*(W/2-14):BX+W/2+8+Math.random()*(W/2-14),BY+6+Math.random()*(BH-12),g.M,G.T,left?'#3b82f6':'#ef4444',5));G.parts[i].side=left?0:1;}}}
function gScaleT(T2){const f=Math.sqrt(T2/G.T);G.parts.forEach(p=>{p.vx*=f;p.vy*=f;p.vz*=f;});G.T=T2;}
function gStep(dt){const W=boxW(),xr=BX+W,P=G.parts,n=P.length;let imp=0;
  for(const p of P){p.x+=p.vx*SC*dt;p.y+=p.vy*SC*dt;
    if(p.x<BX+p.r){p.x=2*(BX+p.r)-p.x;p.vx=Math.abs(p.vx);imp+=2*Math.abs(p.vx);}
    if(p.x>xr-p.r){p.x=2*(xr-p.r)-p.x;p.vx=-Math.abs(p.vx);imp+=2*Math.abs(p.vx);}
    if(p.y<BY+p.r){p.y=2*(BY+p.r)-p.y;p.vy=Math.abs(p.vy);imp+=2*Math.abs(p.vy);}
    if(p.y>BY+BH-p.r){p.y=2*(BY+BH-p.r)-p.y;p.vy=-Math.abs(p.vy);imp+=2*Math.abs(p.vy);}
    if(G.mode==='diff'&&G.wall){const c=BX+W/2;if(p.side===0&&p.x>c-p.r){p.x=2*(c-p.r)-p.x;p.vx=-Math.abs(p.vx);}if(p.side===1&&p.x<c+p.r){p.x=2*(c+p.r)-p.x;p.vx=Math.abs(p.vx);}}}
  if(G.mode!=='brown'){for(let i=0;i<n;i++){const a=P[i];for(let j=i+1;j<n;j++){const b=P[j];const dx=b.x-a.x,dy=b.y-a.y,rr=a.r+b.r;if(dx*dx+dy*dy<rr*rr){const d=Math.sqrt(dx*dx+dy*dy)||1e-6,nx=dx/d,ny=dy/d,vr=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(vr<0){a.vx+=vr*nx;a.vy+=vr*ny;b.vx-=vr*nx;b.vy-=vr*ny;}const ov=(rr-d)/2;a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;}}}}
  else{const B=G.big;B.x+=B.vx*SC*dt;B.y+=B.vy*SC*dt;if(B.x<BX+B.r){B.x=BX+B.r;B.vx=Math.abs(B.vx);}if(B.x>xr-B.r){B.x=xr-B.r;B.vx=-Math.abs(B.vx);}if(B.y<BY+B.r){B.y=BY+B.r;B.vy=Math.abs(B.vy);}if(B.y>BY+BH-B.r){B.y=BY+BH-B.r;B.vy=-Math.abs(B.vy);}
    for(const p of P){const dx=B.x-p.x,dy=B.y-p.y,rr=B.r+p.r;if(dx*dx+dy*dy<rr*rr){const d=Math.sqrt(dx*dx+dy*dy)||1e-6,nx=dx/d,ny=dy/d,vr=(B.vx-p.vx)*nx+(B.vy-p.vy)*ny;if(vr<0){const J=2*vr/(1+B.m);p.vx+=J*B.m*nx;p.vy+=J*B.m*ny;B.vx-=J*nx;B.vy-=J*ny;}const ov=rr-d;p.x-=nx*ov;p.y-=ny*ov;}}}

function pTheory(){const nu=G.N*1e-3,V=G.V*1e-3;return nu*RG*G.T/V;} // Па; одна частица модели = 10⁻³ моль
function pMeasured(){if(G.impT<.2)return null;const g=gInfo(),rr_=g.r*.7,W=boxW()-2*rr_,H=BH-2*rr_,per=2*(W+H),A=W*H;const s2=kB*G.T/(g.M*1e-3/NA);const exp=G.N*s2*SC/A;const meas=G.imp/(per*G.impT);return pTheory()*meas/exp;}
function drawGasCv(){const cv=$('#gCv'),g=cv.getContext('2d');const W=boxW();g.clearRect(0,0,CW_,CH_);

  if(G.mode==='gas'){g.fillStyle=muted;g.font='16px "PT Sans", Arial, sans-serif';g.fillText(L('поршень','поршень'),Math.min(BX+W+16,CW_-70),BY+BH/2-14);}}
function drawHist(){const svg=$('#gHist');svg.innerHTML='';svg.setAttribute('viewBox','0 0 620 300');const g=gInfo();const m0=g.M*1e-3/NA,T=G.T;
  const vr=Math.sqrt(3*kB*T/m0),vmax=Math.max(800,Math.ceil(vrms(1000,g.M)*1.2/200)*200)*(G.T<500?.7:1);const vm=Math.ceil(vr*2.6/100)*100;
  const nb=20,bw=vm/nb,cur=new Array(nb).fill(0);G.parts.forEach(p=>{const v=Math.hypot(p.vx,p.vy,p.vz);const k=Math.floor(v/bw);if(k<nb)cur[k]++;});
  const key=G.gas+'|'+G.T+'|'+G.N;if(G.hkey!==key){G.hkey=key;G.hacc=new Array(nb).fill(0);G.hn=0;}cur.forEach((c,i)=>G.hacc[i]+=c);G.hn++;const cnt=G.hacc.map(c=>c/G.hn);
  const NN=G.parts.length||1;const f=v=>4*Math.PI*Math.pow(m0/(2*Math.PI*kB*T),1.5)*v*v*Math.exp(-m0*v*v/(2*kB*T));const fmx=f(Math.sqrt(2*kB*T/m0));

  const pts=[];for(let i=0;i<=120;i++){const v=vm*i/120;pts.push([P.X(v),P.Y(f(v)*bw*NN)]);}path(svg,pts,{stroke:'var(--ink)','stroke-width':3});
  [[Math.sqrt(2*kB*T/m0),'v_вер','var(--c4)'],[vr,'v_кв','var(--c2)']].forEach(([v,n,c],k)=>{el('line',{x1:P.X(v),x2:P.X(v),y1:P.Y(0),y2:P.Y(ym*.95),stroke:c,'stroke-width':2.5,'stroke-dasharray':'6 5'},svg);txt(svg,n==='v_кв'?L('v кв','v кв'):L('v вер','v ықт'),P.X(v)+(k?6:-6),P.Y(ym*.9),{'font-size':16,fill:c,'text-anchor':k?'start':'end','font-weight':700});});}
function gReadout(){const g=gInfo();const T=G.T,m0=g.M*1e-3/NA;

const MATS=()=>[{k:'ice',n:L('Лёд (кристалл)','Мұз (кристалл)'),cr:true,t0:-30,tm:0,t1:40,col:'#38bdf8',col2:'#2563eb'},{k:'sn',n:L('Олово (кристалл)','Қалайы (кристалл)'),cr:true,t0:150,tm:232,t1:300,col:'#cbd5e1',col2:'#64748b'},{k:'glass',n:L('Смола / стекло (аморфное)','Шайыр / шыны (аморфты)'),cr:false,t0:20,tm:60,t1:120,col:'#f59e0b',col2:'#b45309'}];
const CR={mat:0,run:false,t:-30,tau:0,melt:0,parts:[],hist:[],sp:1};
function crInit(){const M=MATS()[CR.mat];CR.t=M.t0;CR.tau=0;CR.melt=0;CR.hist=[[0,M.t0]];CR.run=false;const sd=mulberry(9);CR.parts=[];
  const nx=14,ny=8,dx=40,dy=34.6,x0=90,y0=440-ny*dy;
  for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){let hx=x0+i*dx+(j%2)*dx/2,hy=y0+j*dy+16;if(!M.cr){hx+=(sd()-.5)*22;hy+=(sd()-.5)*18;}
    const edge=Math.min(i,nx-1-i,j,ny-1-j);CR.parts.push({hx,hy,x:hx,y:hy,liq:false,ord:edge+sd()*1.5,ph:sd()*6.3});}
  CR.parts.sort((a,b)=>a.ord-b.ord);crControls();crDraw();crGraph();}
function crRate(M){return M.cr?(CR.t<M.tm?1:.55):(.9-.25/(1+Math.exp(-(CR.t-M.tm)/10)));}
function crStep(dt){const M=MATS()[CR.mat];const r=(M.t1-M.t0)/14;CR.tau+=dt;
  if(M.cr&&CR.t>=M.tm&&CR.melt<1){CR.melt=Math.min(1,CR.melt+dt/5);const nm=Math.floor(CR.melt*CR.parts.length);CR.parts.forEach((p,i)=>{if(i<nm)p.liq=true;});CR.t=M.tm;}
  else{CR.t=Math.min(M.t1,CR.t+r*crRate(M)*dt);if(M.cr&&CR.t>=M.tm&&CR.melt<1)CR.t=M.tm;}
  if(CR.t>=M.t1)CR.run=false;CR.hist.push([CR.tau,CR.t]);}
function crMove(){const M=MATS()[CR.mat];const P=CR.parts;const fr=(CR.t-M.t0)/(M.t1-M.t0);const A=1.2+4*Math.max(0,fr);
  let D=0;if(!M.cr)D=2.4/(1+Math.exp(-(CR.t-M.tm)/7));
  P.forEach(p=>{const mob=M.cr?(p.liq?3.5:0):D*1.4;if(mob>0){p.hx+=(Math.random()-.5)*mob*2;p.hy+=(Math.random()-.5)*mob*2+mob*.15;}
    p.hx=Math.max(40,Math.min(720,p.hx));p.hy=Math.max(120,Math.min(440,p.hy));});
  if(M.cr?CR.melt>0:D>.05){for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=P[i],b=P[j];const dx=b.hx-a.hx,dy=b.hy-a.hy,d=Math.hypot(dx,dy);if(d<34&&d>0){const o=(34-d)/2*.5;const ux=dx/d,uy=dy/d;if(a.liq||!M.cr){a.hx-=ux*o;a.hy-=uy*o;}if(b.liq||!M.cr){b.hx+=ux*o;b.hy+=uy*o;}}}}
  P.forEach(p=>{p.x=p.hx+(Math.random()-.5)*2*A;p.y=p.hy+(Math.random()-.5)*2*A;});}
function crDraw(){const cv=$('#crCv'),g=cv.getContext('2d');const M=MATS()[CR.mat];g.clearRect(0,0,760,470);
  g.fillStyle=cssv('--surface');g.fillRect(30,100,700,360);g.strokeStyle=cssv('--ink');g.lineWidth=3;g.beginPath();g.moveTo(30,100);g.lineTo(30,460);g.lineTo(730,460);g.lineTo(730,100);g.stroke();
  // нагреватель
  const on=CR.run;g.fillStyle=on?'#ef4444':cssv('--muted');g.fillRect(30,462,700,8);
  const P=CR.parts;
  if(!P.some(p=>p.liq)&&M.cr){g.strokeStyle=cssv('--line');g.lineWidth=1.5;for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=P[i],b=P[j];if(Math.hypot(a.hx-b.hx,a.hy-b.hy)<42){g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();}}}
  P.forEach(p=>{g.beginPath();g.arc(p.x,p.y,14,0,7);g.fillStyle=p.liq?M.col2:M.col;g.fill();g.strokeStyle=cssv('--ink');g.lineWidth=1;g.stroke();});
  g.fillStyle=cssv('--ink');g.font='bold 22px "PT Sans", Arial, sans-serif';g.fillText(`t = ${fmt(CR.t,3)} °C`,40,40);g.font='17px "PT Sans", Arial, sans-serif';g.fillStyle=cssv('--muted');g.fillText(crState(),40,70);}
function crState(){const M=MATS()[CR.mat];
  if(M.cr){if(CR.melt<=0)return L('твёрдое: частицы колеблются около узлов решётки','қатты: бөлшектер тор түйіндерінің маңында тербеледі');if(CR.melt<1)return L(`плавление при t = ${M.tm} °C: температура не меняется, расплавилось ${Math.round(CR.melt*100)} %`,`t = ${M.tm} °C кезінде балқу: температура өзгермейді, ${Math.round(CR.melt*100)} % балқыды`);return L('жидкость: дальнего порядка нет','сұйық: алыс рет жоқ');}
  const D=1/(1+Math.exp(-(CR.t-M.tm)/7));return D<.15?L('твёрдое аморфное тело: только ближний порядок','қатты аморфты дене: тек жақын рет'):D<.85?L('размягчается: вязкость уменьшается постепенно, без определённой t плавления','жұмсаруда: тұтқырлық біртіндеп кемиді, белгілі балқу t жоқ'):L('текучее состояние','аққыш күй');}
function crGraph(){const svg=$('#crG');svg.innerHTML='';svg.setAttribute('viewBox','0 0 620 320');const M=MATS()[CR.mat];const tm=Math.max(30,CR.hist[CR.hist.length-1][0]*1.1);
  const P=mkPlot(svg,{x0:0,x1:tm,y0:M.t0-10,y1:M.t1+10,W:620,H:320,pl:58,pb:44});const st=nice(M.t1-M.t0+20,6);
  axes(svg,P,{x0:0,x1:tm,y0:M.t0-10,y1:M.t1+10,xt:ticks(0,tm,nice(tm,6)),yt:ticks(Math.ceil((M.t0-10)/st)*st,M.t1+10,st),xl:L('τ, с','τ, с'),yl:'t, °C'});
  if(M.cr){el('line',{x1:P.X(0),x2:P.X(tm),y1:P.Y(M.tm),y2:P.Y(M.tm),stroke:'var(--c2)','stroke-dasharray':'6 5','stroke-width':2},svg);txt(svg,L(`t пл = ${M.tm} °C`,`t балқу = ${M.tm} °C`),P.X(tm)-6,P.Y(M.tm)-8,{'text-anchor':'end','font-size':16,fill:'var(--c2)'});}
  path(svg,CR.hist.filter((_,i)=>i%2===0||i===CR.hist.length-1).map(([a,b])=>[P.X(a),P.Y(b)]),{stroke:M.cr?'var(--c1)':'var(--c3)','stroke-width':3.5});}
function crControls(){$('#crMat').innerHTML=MATS().map((m,i)=>`<button data-m="${i}" aria-pressed="${CR.mat===i}">${m.n}</button>`).join('');
  $('#crBtns').innerHTML=`<button class="btn" data-a="run">${CR.run?L('⏸ Пауза','⏸ Үзіліс'):L('🔥 Нагревать','🔥 Қыздыру')}</button><button class="btn ghost" data-a="reset">${L('⟲ Сначала','⟲ Басынан')}</button>`;
  const M=MATS()[CR.mat];$('#crTip').innerHTML=M.cr?L('Нагреватель передаёт телу энергию. Пока лёд/олово твёрдые, частицы лишь сильнее колеблются около узлов решётки и температура растёт. При t плавления энергия идёт на разрушение решётки — <b>температура не меняется</b>, пока всё не расплавится (горизонтальный участок графика).','Қыздырғыш денеге энергия береді. Мұз/қалайы қатты болғанда бөлшектер тор түйіндерінің маңында күштірек тербеліп, температура артады. Балқу температурасында энергия торды бұзуға жұмсалады — бәрі балқып біткенше <b>температура өзгермейді</b> (графиктің горизонталь бөлігі).'):L('В аморфном теле нет кристаллической решётки, поэтому нет и определённой температуры плавления: при нагревании подвижность частиц растёт постепенно, тело размягчается и становится текучим — на графике нет горизонтального участка.','Аморфты денеде кристалдық тор жоқ, сондықтан белгілі балқу температурасы да жоқ: қыздырғанда бөлшектердің қозғалғыштығы біртіндеп артады, дене жұмсарып, аққыш болады — графикте горизонталь бөлік жоқ.');}

    (TEACH?'':`<div class="row" style="margin-top:14px"><button class="btn ghost" data-c="next" ${n>=N?'disabled':''}>${L('Подсказка: следующий шаг','Кеңес: келесі қадам')} (${Math.min(n+1,N)}/${N})</button>${ansOn?'':`<button class="btn ghost" data-c="ans">${L('Показать ответ','Жауапты көрсету')}</button><button class="btn ghost" data-c="all">${L('Всё решение','Толық шешім')}</button>`}</div>`);
  const inp=root.querySelector('input.num');
  if(inp){const go=()=>{const v=(P.parse||parseNum)(inp.value);if(v===null)return;st.raw=inp.value;st.tries.push(v);redraw();};root.querySelector('.go').addEventListener('click',go);inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();});}
  root.querySelectorAll('[data-c]').forEach(b=>b.addEventListener('click',()=>{if(b.disabled)return;const c=b.dataset.c;if(c==='next')st.shown++;else if(c==='ans')st.ans=true;else{st.shown=99;st.ans=true;}redraw();}));
}





const LET='АБВГ';
function renderQ(box,q,chosen,{onAnswer,nextLabel,onNext}){
  box.innerHTML=`<div class="qcard"><div class="qcat">${q.cat}</div><div class="qtext">${q.q}</div><div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-o="${i}"><span class="k">${LET[i]}</span><span>${o}</span></button>`).join('')}</div><div class="fb"></div></div>`;
  const btns=[...box.querySelectorAll('.opt')];
  const showFb=(i,focus)=>{const ok=i===q.ans;btns.forEach(x=>{x.disabled=true;});btns[q.ans].classList.add('right');if(!ok)btns[i].classList.add('wrong');
    const fb=box.querySelector('.fb');fb.innerHTML=`<div class="expl ${ok?'ok':'no'}"><b>${ok?L('Верно!','Дұрыс!'):L('Неверно. Правильный ответ: ','Қате. Дұрыс жауап: ')+LET[q.ans]}</b>${q.ex}</div>`;
    const nb=document.createElement('button');nb.className='btn';nb.textContent=nextLabel();nb.style.marginTop='14px';nb.addEventListener('click',onNext);fb.appendChild(nb);if(focus)nb.focus({preventScroll:true});};
  if(chosen!=null)showFb(chosen,false);
  btns.forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.o;showFb(i,true);onAnswer(i===q.ans,i);}));
}
const T={cat:'all',done:0,ok:0,streak:0,best:0,rec:null,chosen:null};
try{T.best=+localStorage.getItem('mkt-best')||0;}catch(e){}
function renderTrCat(){const C_=[['all',L('Все темы','Барлық тақырыптар')],...Object.entries(CATN())];$('#trCat').innerHTML=C_.map(([k,l])=>`<button data-c="${k}" aria-pressed="${k===T.cat}">${l}</button>`).join('');}
$('#trCat').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;T.cat=b.dataset.c;[...$('#trCat').children].forEach(x=>x.setAttribute('aria-pressed',x===b));nextTrain();});
function stats(){$('#sDone').textContent=T.done;$('#sOk').textContent=T.ok;$('#sStreak').textContent=T.streak;$('#sBest').textContent=T.best;}
function drawTrain(){renderQ($('#trBox'),build(T.rec),T.chosen,{nextLabel:()=>L('Следующее задание','Келесі тапсырма'),onNext:nextTrain,onAnswer:(ok,i)=>{T.chosen=i;T.done++;if(ok){T.ok++;T.streak++;if(T.streak>T.best){T.best=T.streak;try{localStorage.setItem('mkt-best',T.best);}catch(e){}}}else T.streak=0;stats();}});}
function nextTrain(){T.rec={cat:T.cat,seed:newSeed()};T.chosen=null;drawTrain();}
const TT={phase:'intro',recs:[],i:0,ok:0,chosen:[]};
function drawTest(){if(TT.phase==='intro')testIntro();else if(TT.phase==='q')testStep();else testEnd();}
function testIntro(){let best=null;try{best=localStorage.getItem('mkt-test');}catch(e){}
  $('#testBox').innerHTML=`<div class="qcard"><h2>${L('Итоговый тест','Қорытынды тест')}</h2><p>${L('10 заданий: положения МКТ и опытные факты, термодинамические параметры и основное уравнение МКТ, расчёты, кристаллические и аморфные тела, графики. После каждого ответа — разбор, в конце — итог и список ошибок.','10 тапсырма: МКТ қағидалары мен тәжірибелік фактілер, термодинамикалық параметрлер және МКТ-ның негізгі теңдеуі, есептеулер, кристалдық және аморфты денелер, графиктер. Әр жауаптан кейін талдау, соңында қорытынды және қателер тізімі.')}</p>
    ${best!==null?`<p class="stat">${L('Ваш лучший результат','Ең жақсы нәтижеңіз')}: <b>${best} / 10</b></p>`:''}<button class="btn" id="tStart">${L('Начать тест','Тестті бастау')}</button></div>`;
  $('#tStart').addEventListener('click',startTest);}
function startTest(){TT.recs=shuffle(['th','th','par','par','par','calc','calc','cr','cr','graph']).map(c=>({cat:c,seed:newSeed()}));TT.i=0;TT.ok=0;TT.chosen=[];TT.phase='q';testStep();}
function testStep(){const q=build(TT.recs[TT.i]),box=$('#testBox'),ch=TT.chosen[TT.i];
  box.innerHTML=`<div class="row" style="margin-bottom:10px"><span class="stat">${L('Задание','Тапсырма')} <b>${TT.i+1}</b> / 10</span><span class="stat">${L('Верно','Дұрыс')}: <b id="tOk">${TT.ok}</b></span></div><div class="progress" style="margin-bottom:16px"><i style="width:${(TT.i+(ch!=null?1:0))*10}%"></i></div><div id="tQ"></div>`;
  renderQ($('#tQ'),q,ch,{nextLabel:()=>TT.i<9?L('Дальше','Әрі қарай'):L('Показать результат','Нәтижені көрсету'),onNext:()=>{TT.i++;if(TT.i<10)testStep();else{TT.phase='end';testEnd();}},
    onAnswer:(ok,i)=>{TT.chosen[TT.i]=i;if(ok)TT.ok++;box.querySelector('.progress i').style.width=(TT.i+1)*10+'%';$('#tOk').textContent=TT.ok;}});}
function testEnd(){const s=TT.ok;const msg=s>=9?L('Отлично! Тема усвоена.','Өте жақсы! Тақырып меңгерілді.'):s>=7?L('Хорошо. Повторите задания, где были ошибки.','Жақсы. Қате жіберген тапсырмаларды қайталаңыз.'):s>=5?L('Неплохо, но стоит потренироваться ещё.','Жаман емес, бірақ тағы жаттығу керек.'):L('Вернитесь к теории и модели, затем потренируйтесь ещё.','Теория мен модельге қайта оралып, сосын тағы жаттығыңыз.');
  try{const prev=localStorage.getItem('mkt-test');if(prev===null||s>+prev)localStorage.setItem('mkt-test',s);}catch(e){}
  const wrong=TT.recs.map((r,i)=>({q:build(r),c:TT.chosen[i]})).filter(x=>x.c!==x.q.ans);
  $('#testBox').innerHTML=`<div class="qcard"><div class="qcat">${L('Результат','Нәтиже')}</div><div class="score">${s} <span style="font-size:1.4rem;color:var(--muted)">/ 10</span></div><p>${msg}</p>
    ${wrong.length?`<h3>${L('Разбор ошибок','Қателерді талдау')}</h3><div class="review">${wrong.map(({q})=>`<div><span class="qcat">${q.cat}</span><span>${q.q}</span><span>${L('Ответ','Жауабы')}: ${q.opts[q.ans]}</span><span style="color:var(--muted)">${q.ex}</span></div>`).join('')}</div>`:''}
    <div class="row"><button class="btn" id="tAgain">${L('Пройти ещё раз','Қайта тапсыру')}</button><button class="btn ghost" id="tTrain">${L('Перейти в тренажёр','Жаттықтырғышқа өту')}</button></div></div>`;
  $('#tAgain').addEventListener('click',startTest);$('#tTrain').addEventListener('click',()=>showTab('train'));}




/* ================= переключатели ================= */
function renderAll(){applyUI();renderTheory();gControls();gReadout();drawHist();crControls();crDraw();crGraph();drawProb();renderTrCat();stats();drawTrain();drawTest();}
$('#langSw').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.dataset.lang===LANG)return;LANG=b.dataset.lang;try{localStorage.setItem('mkt-lang',LANG);}catch(e){}renderAll();});
function setSize(px){document.documentElement.style.fontSize=px+'px';[...$('#sizeSw').children].forEach(b=>b.setAttribute('aria-pressed',+b.dataset.sz===px));}
$('#sizeSw').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const px=+b.dataset.sz;setSize(px);try{localStorage.setItem('mkt-size',px);}catch(e){}});
(function(){let px=22;try{const v=+localStorage.getItem('mkt-size');if([16,22,28].includes(v))px=v;}catch(e){}setSize(px);})();
const mq=matchMedia('(prefers-color-scheme: dark)');
function syncTheme(){const t=document.documentElement.dataset.theme||(mq.matches?'dark':'light');[...$('#themeSw').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.th===t));}
$('#themeSw').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;document.documentElement.dataset.theme=b.dataset.th;try{localStorage.setItem('mkt-theme',b.dataset.th);}catch(e){}syncTheme();});
try{const t=localStorage.getItem('mkt-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}
mq.addEventListener('change',syncTheme);new MutationObserver(syncTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
PR.seed=newSeed();T.rec={cat:'all',seed:newSeed()};
gInit();crInit();renderAll();syncTheme();
(function(){const h=location.hash.slice(1);let t=TABS.includes(h)?h:null;if(!t){try{const s=localStorage.getItem('mkt-tab');if(TABS.includes(s))t=s;}catch(e){}}showTab(t||'theory');})();

</script>
<style>

<canvas id="penCv"></canvas>
<div id="penBar">
  <div class="tools">
    <button data-pc="ink" class="pc"><span class="sw"></span></button>
    <button data-pc="red" class="pc"><span class="sw"></span></button>
    <button data-pc="blue" class="pc"><span class="sw"></span></button>
    <button data-pc="green" class="pc"><span class="sw"></span></button>
    <button data-pc="orange" class="pc"><span class="sw"></span></button>
    <button data-pc="violet" class="pc"><span class="sw"></span></button>
    <span class="sep"></span>
    <button data-pw="3" class="pw"><span class="wd" style="width:6px;height:6px"></span></button>
    <button data-pw="6" class="pw"><span class="wd" style="width:11px;height:11px"></span></button>
    <button data-pw="12" class="pw"><span class="wd" style="width:18px;height:18px"></span></button>

    <button id="penEr"><svg viewBox="0 0 24 24"><path d="M7 21h12"/><path d="M5.5 15.5 14 7l5 5-8.5 8.5H7.5z"/><path d="M9.5 11.5l5 5"/></svg></button>
    <button id="penUndo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button id="penClr"><svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg></button>
    <span class="sep"></span>
  </div>
  <button id="penMain" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M15 4l5 5L9 20H4v-5z"/><path d="M13 6l5 5"/></svg></button>
</div>
<script>
(function(){
  const cv=document.getElementById('penCv'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const LNG=()=>(typeof LANG!=='undefined'&&LANG==='kz')?1:0;
  const TIP={penMain:['Ручка: рисовать на экране (Esc — выключить)','Қалам: экранға жазу (Esc — өшіру)'],penEr:['Ластик','Өшіргіш'],penUndo:['Отменить последнее','Соңғысын болдырмау'],penClr:['Стереть всё на этой вкладке','Осы беттегінің бәрін өшіру'],
    ink:['Чёрный','Қара'],red:['Красный','Қызыл'],blue:['Синий','Көк'],green:['Зелёный','Жасыл'],orange:['Оранжевый','Қызғылт сары'],violet:['Фиолетовый','Күлгін'],w3:['Тонкая линия','Жіңішке сызық'],w6:['Средняя линия','Орташа сызық'],w12:['Толстая линия','Жуан сызық']};
  const COL={ink:['#1c2746','#f1f4fb'],red:['#dc2626','#ff6b6b'],blue:['#2563eb','#7aa2ff'],green:['#15803d','#4ade80'],orange:['#ea580c','#fb923c'],violet:['#7c3aed','#c4a5ff']};
  const mqD=matchMedia('(prefers-color-scheme: dark)');
  const dark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':mqD.matches;};
  const st={on:false,color:'red',w:6,er:false,pages:{},cleared:{},cur:null};
  const key=()=>{const t=document.querySelector('[role="tab"][aria-selected="true"]');return t?(t.id||t.dataset.tab||t.textContent):'main';};
  const list=()=>st.pages[key()]||(st.pages[key()]=[]);
  let dpr=1;
  function size(){dpr=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(innerWidth*dpr);cv.height=Math.round(innerHeight*dpr);redraw();}
  function stroke(s){if(s.p.length===0)return;ctx.save();ctx.globalCompositeOperation=s.er?'destination-out':'source-over';
    ctx.strokeStyle=s.er?'#000':COL[s.c][dark()?1:0];ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=s.w;ctx.lineCap='round';ctx.lineJoin='round';
    const ox=scrollX,oy=scrollY,p=s.p;
    if(p.length===1){ctx.beginPath();ctx.arc(p[0][0]-ox,p[0][1]-oy,s.w/2,0,7);ctx.fill();}
    else{ctx.beginPath();ctx.moveTo(p[0][0]-ox,p[0][1]-oy);for(let i=1;i<p.length-1;i++){const mx=(p[i][0]+p[i+1][0])/2,my=(p[i][1]+p[i+1][1])/2;ctx.quadraticCurveTo(p[i][0]-ox,p[i][1]-oy,mx-ox,my-oy);}
      const l=p[p.length-1];ctx.lineTo(l[0]-ox,l[1]-oy);ctx.stroke();}
    ctx.restore();}
  function redraw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,innerWidth,innerHeight);list().forEach(stroke);if(st.cur)stroke(st.cur);}
  function tips(){const l=LNG();bar.querySelectorAll('button').forEach(b=>{const k=b.id||(b.dataset.pc)||('w'+b.dataset.pw);const t=TIP[k];if(t){b.title=t[l];b.setAttribute('aria-label',t[l]);}});}
  function ui(){bar.classList.toggle('open',st.on);cv.classList.toggle('on',st.on);cv.classList.toggle('er',st.er);
    document.getElementById('penMain').setAttribute('aria-pressed',st.on);
    bar.querySelectorAll('.pc').forEach(b=>{b.setAttribute('aria-pressed',!st.er&&b.dataset.pc===st.color);b.firstElementChild.style.background=COL[b.dataset.pc][dark()?1:0];});
    bar.querySelectorAll('.pw').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.pw===st.w));
    document.getElementById('penEr').setAttribute('aria-pressed',st.er);tips();}
  bar.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    if(b.id==='penMain'){st.on=!st.on;}
    else if(b.dataset.pc){st.color=b.dataset.pc;st.er=false;}
    else if(b.dataset.pw){st.w=+b.dataset.pw;}
    else if(b.id==='penEr'){st.er=!st.er;}
    else if(b.id==='penUndo'){const L_=list();if(L_.length)L_.pop();else if(st.cleared[key()]){st.pages[key()]=st.cleared[key()];delete st.cleared[key()];}redraw();}
    else if(b.id==='penClr'){if(list().length){st.cleared[key()]=list();st.pages[key()]=[];}redraw();}
    ui();});
  function pt(e){return[e.clientX+scrollX,e.clientY+scrollY];}
  cv.addEventListener('pointerdown',e=>{if(!st.on)return;e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(_){}
    const er=st.er||e.button===5||(e.buttons&32);
    st.cur={c:st.color,w:er?Math.max(30,st.w*4):st.w,er,p:[pt(e)]};delete st.cleared[key()];redraw();});
  cv.addEventListener('pointermove',e=>{if(!st.cur)return;const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];(evs.length?evs:[e]).forEach(ev=>st.cur.p.push(pt(ev)));redraw();});
  const end=()=>{if(!st.cur)return;list().push(st.cur);st.cur=null;redraw();};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);cv.addEventListener('lostpointercapture',end);
  addEventListener('scroll',redraw,{passive:true});addEventListener('resize',size);
  addEventListener('keydown',e=>{if(e.key==='Escape'&&st.on){st.on=false;ui();}});
  new MutationObserver(()=>{redraw();ui();}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme','lang']});
  mqD.addEventListener('change',()=>{redraw();ui();});
  document.querySelectorAll('[role="tab"]').forEach(t=>new MutationObserver(redraw).observe(t,{attributes:true,attributeFilter:['aria-selected']}));
  document.addEventListener('click',e=>{if(e.target.closest('#langSw,[data-lang]'))setTimeout(tips,0);});
  size();ui();
})();
</script>
